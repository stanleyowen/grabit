# /etc/nginx/sites-available/video-downloader
# __DOMAIN__ is replaced by install.sh. Get a certificate first with:
#   sudo certbot certonly --nginx -d __DOMAIN__

limit_req_zone  $binary_remote_addr zone=vd_api:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=vd_info:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=vd_conn:10m;

upstream video_downloader {
    server 127.0.0.1:3003;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vd_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 120s;
    limit_conn vd_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    # Metadata lookups spawn processes: tighter limit.
    location = /api/info {
        limit_req zone=vd_info burst=20 nodelay;
        include /etc/nginx/snippets/video-downloader-proxy.conf;
    }

    location /api/ {
        limit_req zone=vd_api burst=100 nodelay;
        include /etc/nginx/snippets/video-downloader-proxy.conf;
    }

    location = /health {
        access_log off;
        include /etc/nginx/snippets/video-downloader-proxy.conf;
    }

    # Files are authorised by Node, then streamed by nginx (sendfile, ranges,
    # zero Node CPU). Requires X_ACCEL_PREFIX=/_protected/ in the app env.
    location /_protected/ {
        internal;
        alias /var/lib/video-downloader/downloads/;
        sendfile on;
        tcp_nopush on;
        aio threads;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Optional: serve the built frontend from here instead of Netlify
    # (removes the proxy hop entirely). Uncomment and deploy client/dist.
    # root /opt/video-downloader/client/dist;
    # location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # location / { try_files $uri /index.html; }
    location / { return 404; }
}
